name: osb_core
description: >-
  Plain Dart shared by OpenSportsBall's apps: the website's config, signing
  in with Cognito, the API, downloading footage and driving the processing
  engine. No Flutter, so it is tested with `dart test`.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
