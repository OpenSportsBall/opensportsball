version = 1

# Files that cannot carry an SPDX header (Markdown, JSON, YAML, TOML, ...).
# When several annotations match a file, the last one wins, and a header
# inside the file always takes precedence over these.

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 The OpenSportsBall Authors"
SPDX-License-Identifier = "Apache-2.0"

# Brand fonts (SIL Open Font License 1.1), bundled for the website and the apps.
[[annotations]]
path = ["web/static/fonts/Rubik-*", "app/assets/fonts/Rubik-*", "desktop/assets/fonts/Rubik-*"]
SPDX-FileCopyrightText = "2015 The Rubik Project Authors (https://github.com/googlefonts/rubik)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["web/static/fonts/AtkinsonHyperlegible-*", "app/assets/fonts/AtkinsonHyperlegible-*", "desktop/assets/fonts/AtkinsonHyperlegible-*"]
SPDX-FileCopyrightText = "2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["web/static/fonts/IBMPlexMono-*", "app/assets/fonts/IBMPlexMono-*", "desktop/assets/fonts/IBMPlexMono-*"]
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

# Vendored third-party code; see app/third_party/README.md.
[[annotations]]
path = "app/third_party/bluetooth_low_energy_android/**"
SPDX-FileCopyrightText = "2025 zeekr.dev"
SPDX-License-Identifier = "MIT"
