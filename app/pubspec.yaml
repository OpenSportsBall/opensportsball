name: sportsballvideo
description: Two-phone game recorder. One app, Main or Secondary role.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dual_camera:
    path: plugins/dual_camera
  bluetooth_low_energy: ^6.2.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  uuid: ^4.6.0
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
