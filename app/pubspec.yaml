name: opensportsball
description: Two-phone game recorder. One app, Main or Secondary role.
publish_to: none
version: 0.1.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dual_camera:
    path: plugins/dual_camera
  bluetooth_low_energy: ^6.2.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  uuid: ^4.6.0
  device_info_plus: ^13.3.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^11.2.0
  app_links: ^7.2.2
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Vendored copy that builds with Flutter's built-in Kotlin; see
# third_party/README.md.
dependency_overrides:
  bluetooth_low_energy_android:
    path: third_party/bluetooth_low_energy_android

flutter:
  uses-material-design: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
