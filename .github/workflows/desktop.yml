name: desktop

# The Mac app and the Dart package under it. Runs only when they (or the
# engine formats they read) change: the build needs a macOS runner.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "packages/**"
      - "shared/schemas/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "packages/**"
      - "shared/schemas/**"
      - ".github/workflows/desktop.yml"

jobs:
  osb_core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/osb_core
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # pinned: 3.50 deprecates package:flutter/material.dart, which analyze fails on
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # pinned: 3.50 deprecates package:flutter/material.dart, which analyze fails on
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - run: flutter build macos --debug
